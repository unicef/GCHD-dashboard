server {
    listen 80;
    server_name pixel-aid.com www.pixel-aid.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pixel-aid.com www.pixel-aid.com;

    # Filled in by: sudo certbot --nginx -d pixel-aid.com -d www.pixel-aid.com
    ssl_certificate     /etc/letsencrypt/live/pixel-aid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixel-aid.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:8502;
        proxy_http_version 1.1;

        # WebSocket support (required for Dash live callbacks)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GEE queries can be slow
        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
    }
}
